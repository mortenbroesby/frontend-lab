name: Verify the lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Front End Lab
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: Front End Lab
      - uses: actions/setup-node@v7
        with:
          node-version-file: Front End Lab/.nvmrc
          cache: npm
          cache-dependency-path: Front End Lab/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run analyze:baseline
      - name: Audit new and worsened findings
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'pull_request' || github.event_name == 'push')
        env:
          FALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$FALLOW_BASE" = "0000000000000000000000000000000000000000" ]; then
            FALLOW_BASE=$(git hash-object -w -t tree /dev/null)
          fi
          npm run analyze:changes -- --base "$FALLOW_BASE"
      - run: npm run storybook:build
      - name: Generate a standalone demo through the CLI
        run: npm run demo:new -- --args "Portable demo" portable-demo modern-web CI "Check the standalone workflow."
      - run: npm install
      - run: npm run check --workspace @lab/demo-portable-demo
      - run: npm run build --workspace front-end-lab-gallery
      - run: npm run test:servers
