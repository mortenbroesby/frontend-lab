name: Verify the lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - name: Install browser for participant journeys
        run: npx playwright install --with-deps chromium
        working-directory: playground
      - run: npm run test:browser
      - name: Audit introduced findings
        if: github.event_name == 'pull_request'
        env:
          FALLOW_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run analyze:changes -- --base "$FALLOW_BASE"
