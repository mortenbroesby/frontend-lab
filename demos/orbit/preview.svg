<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title"><title id="title">Orbit — a scroll-driven laptop story</title><defs><radialGradient id="glow"><stop stop-color="#88725d" stop-opacity=".5"/><stop offset="1" stop-color="#0b0c0e" stop-opacity="0"/></radialGradient><linearGradient id="shell"><stop stop-color="#ded9cb"/><stop offset=".5" stop-color="#8a8882"/><stop offset="1" stop-color="#3a3b3c"/></linearGradient><radialGradient id="grille" cx=".3" cy=".2"><stop stop-color="#55595c"/><stop offset="1" stop-color="#121316"/></radialGradient><pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#08090b"/></pattern></defs><rect width="800" height="500" fill="#0b0c0e"/><ellipse cx="570" cy="260" rx="300" ry="280" fill="url(#glow)"/><text x="45" y="60" fill="#eee" font-family="sans-serif" font-size="24">◉ orbit</text><text x="45" y="210" fill="#f5f3ee" font-family="sans-serif" font-weight="600" font-size="57" letter-spacing="-3">More room</text><text x="45" y="272" fill="#f5f3ee" font-family="sans-serif" font-weight="600" font-size="57" letter-spacing="-3">to create.</text><text x="48" y="325" fill="#aaa" font-family="sans-serif" font-size="14">A scroll story. Made to unfold.</text><g transform="translate(445 155) rotate(-5 145 110)"><rect x="20" y="0" width="260" height="170" rx="9" fill="url(#shell)"/><rect x="27" y="7" width="246" height="156" rx="4" fill="#12141b"/><rect x="34" y="14" width="232" height="142" fill="#443fc0"/><ellipse cx="180" cy="75" rx="70" ry="60" fill="#549ddd"/><text x="48" y="45" fill="white" font-family="sans-serif" font-size="14">Make room.</text><path d="M20 170H280L310 238H-10Z" fill="url(#shell)"/><path d="M32 178H268L280 206H20Z" fill="#171a23"/><path d="M110 211H190L195 230H105Z" fill="#9295a0"/></g><text x="45" y="458" fill="#888" font-family="sans-serif" font-size="10" letter-spacing="3">OBJECT STUDY Nº 01</text></svg>
