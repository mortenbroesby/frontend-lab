<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title"><title id="title">Orbit — a scroll-driven speaker story</title><defs><radialGradient id="glow"><stop stop-color="#88725d" stop-opacity=".5"/><stop offset="1" stop-color="#0b0c0e" stop-opacity="0"/></radialGradient><linearGradient id="shell"><stop stop-color="#ded9cb"/><stop offset=".5" stop-color="#8a8882"/><stop offset="1" stop-color="#3a3b3c"/></linearGradient><radialGradient id="grille" cx=".3" cy=".2"><stop stop-color="#55595c"/><stop offset="1" stop-color="#121316"/></radialGradient><pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#08090b"/></pattern></defs><rect width="800" height="500" fill="#0b0c0e"/><ellipse cx="570" cy="260" rx="300" ry="280" fill="url(#glow)"/><text x="45" y="60" fill="#eee" font-family="sans-serif" font-size="24">◉ orbit</text><text x="45" y="210" fill="#f5f3ee" font-family="sans-serif" font-weight="600" font-size="57" letter-spacing="-3">More room</text><text x="45" y="272" fill="#f5f3ee" font-family="sans-serif" font-weight="600" font-size="57" letter-spacing="-3">for sound.</text><text x="48" y="325" fill="#aaa" font-family="sans-serif" font-size="14">A scroll story. Made to unfold.</text><ellipse cx="590" cy="304" rx="138" ry="122" fill="url(#shell)"/><ellipse cx="590" cy="261" rx="138" ry="122" fill="url(#grille)" stroke="#999" stroke-width="2"/><ellipse cx="590" cy="261" rx="134" ry="118" fill="url(#mesh)"/><ellipse cx="590" cy="202" rx="36" ry="14" fill="#17191c"/><circle cx="590" cy="202" r="2" fill="#d3ebdb"/><text x="45" y="458" fill="#888" font-family="sans-serif" font-size="10" letter-spacing="3">OBJECT STUDY Nº 01</text></svg>
